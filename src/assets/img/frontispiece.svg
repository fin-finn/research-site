<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <g stroke="#1a1a1a" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer thin ring -->
    <circle cx="100" cy="100" r="82" stroke-width="0.9"/>
    <!-- inner ring -->
    <circle cx="100" cy="100" r="72" stroke-width="1.6"/>

    <!-- laurel wreath: left branch -->
    <path d="M100 172 C74 168, 52 150, 44 122" stroke-width="1.3"/>
    <!-- leaves on left branch -->
    <g fill="#1a1a1a" stroke="none">
      <ellipse cx="92" cy="171" rx="6" ry="2.6" transform="rotate(20 92 171)"/>
      <ellipse cx="80" cy="167" rx="6.5" ry="2.7" transform="rotate(28 80 167)"/>
      <ellipse cx="69" cy="161" rx="6.8" ry="2.8" transform="rotate(36 69 161)"/>
      <ellipse cx="60" cy="152" rx="7" ry="2.9" transform="rotate(46 60 152)"/>
      <ellipse cx="52" cy="141" rx="7" ry="2.9" transform="rotate(56 52 141)"/>
      <ellipse cx="47" cy="130" rx="6.6" ry="2.8" transform="rotate(66 47 130)"/>
    </g>
    <!-- laurel wreath: right branch -->
    <path d="M100 172 C126 168, 148 150, 156 122" stroke-width="1.3"/>
    <g fill="#1a1a1a" stroke="none">
      <ellipse cx="108" cy="171" rx="6" ry="2.6" transform="rotate(-20 108 171)"/>
      <ellipse cx="120" cy="167" rx="6.5" ry="2.7" transform="rotate(-28 120 167)"/>
      <ellipse cx="131" cy="161" rx="6.8" ry="2.8" transform="rotate(-36 131 161)"/>
      <ellipse cx="140" cy="152" rx="7" ry="2.9" transform="rotate(-46 140 152)"/>
      <ellipse cx="148" cy="141" rx="7" ry="2.9" transform="rotate(-56 148 141)"/>
      <ellipse cx="153" cy="130" rx="6.6" ry="2.8" transform="rotate(-66 153 130)"/>
    </g>

    <!-- central emblem: a simple rising-line motif (nod to economics/markets) -->
    <path d="M70 118 L88 100 L102 110 L130 78" stroke-width="1.8"/>
    <!-- arrowhead at the end of the rising line -->
    <path d="M130 78 L122 80 M130 78 L128 86" stroke-width="1.8"/>
    <!-- small baseline under the motif -->
    <path d="M68 128 L132 128" stroke-width="0.9"/>

    <!-- little star/compass point at top of ring -->
    <path d="M100 18 L103 27 L100 25 L97 27 Z" fill="#1a1a1a" stroke="none"/>
  </g>
</svg>
