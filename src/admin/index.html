<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the editor out of search results. It holds no content itself. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor</title>
  </head>
  <body>
    <!--
      Sveltia CMS. This page is public, but it is inert on its own: it holds no
      credentials and can save nothing. Every write goes through GitHub, so only
      an account with push access to the repository can publish. Signing in
      happens in a popup served by the auth worker (see auth-worker/).
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.191.2/dist/sveltia-cms.js"
      type="module"
    ></script>
  </body>
</html>
